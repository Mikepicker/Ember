<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ead8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1915" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ember">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preload" href="fonts/courier-prime.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script>try { document.documentElement.dataset.look = localStorage.getItem('look') || 'auto'; } catch {}</script>
<title>Ember</title>
</head>
<body>
<header><b class="mark">ember<i id="dot"></i></b><span id="status"></span></header>

<main id="write">
  <div id="now"></div>
  <textarea id="text" placeholder="type, snap or speak…" autofocus></textarea>
  <div id="attached"></div>
  <nav class="bar">
    <label>photo<input id="photo" type="file" accept="image/*" multiple hidden></label>
    <button id="voice">voice</button>
    <button id="send" class="send">send ↵</button>
  </nav>
</main>

<main id="notes" hidden>
  <input id="search" type="search" placeholder="search…" autocomplete="off">
  <div id="list"></div>
  <button id="look" class="row setting"><span>look</span><span id="look-now"></span></button>
  <button id="sound" class="row setting"><span>sound</span><span id="sound-now"></span></button>
</main>

<main id="ask" hidden>
  <div id="chat"></div>
  <input id="question" placeholder="ask your notes…" enterkeyhint="send" autocomplete="off">
  <nav class="bar">
    <button id="forget">clear</button>
    <button id="asking" class="send">ask ↵</button>
  </nav>
</main>

<main id="read" hidden>
  <div class="label"><span id="pull"></span><a href="#n/feeds">feeds</a></div>
  <div id="news"></div>
</main>

<main id="note" hidden>
  <article id="view"></article>
  <textarea id="edit" hidden></textarea>
  <nav class="bar">
    <button id="back">‹ back</button>
    <button id="remove">delete</button>
    <button id="moving">move</button>
    <button id="editing" class="send">edit</button>
  </nav>
</main>

<footer><a id="tab-write" href="#write">write</a><a id="tab-ask" href="#ask">ask</a><a id="tab-notes" href="#notes">notes</a><a id="tab-read" href="#read">read</a></footer>
<script type="module" src="app.js"></script>
</body>
</html>
